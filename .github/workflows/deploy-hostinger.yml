name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache MiniLM embedder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: minilm-${{ hashFiles('package-lock.json') }}

      - name: Build RAG index
        run: npm run index:rag

      - name: Build
        env:
          VITE_CHAT_URL: ${{ secrets.VITE_CHAT_URL }}
        run: npm run build

      - name: Ensure shastra PDFs are in the build
        run: |
          ls -lh dist/pdfs || true
          test -f dist/pdfs/bhagavad-gita.pdf
          test -f dist/pdfs/mahabharata.pdf
          test -f dist/pdfs/ramayana.pdf
          test -f dist/pdfs/shiva-purana-1.pdf
          test -f dist/pdfs/shiva-purana-2.pdf
          test -f dist/pdfs/shiva-purana-3.pdf

      - name: Ensure RAG index is in the build
        run: |
          test -f dist/rag/shastra-meta.json
          test -f dist/rag/shastra-chunks.json
          test -f dist/rag/shastra-embeddings.bin

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /domains/dharmic-treasures.com/public_html/
          dangerous-clean-slate: false
          timeout: 600000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .DS_Store
